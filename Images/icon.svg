<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0" stop-color="#16406e"/>
      <stop offset="0.55" stop-color="#0a1d38"/>
      <stop offset="1" stop-color="#03070f"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#33ccff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#33ccff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fe0ff"/>
      <stop offset="0.45" stop-color="#1f8fff"/>
      <stop offset="1" stop-color="#0b3fb8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfe9ff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#cfe9ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#cfe9ff" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6a2a"/>
      <stop offset="0.35" stop-color="#f3d27a"/>
      <stop offset="0.6" stop-color="#c99a3c"/>
      <stop offset="1" stop-color="#6e5220"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bff3ff"/>
      <stop offset="1" stop-color="#2aa8ff"/>
    </linearGradient>
    <clipPath id="bowlClip">
      <path d="M300 280 C300 520 395 640 512 648 C629 640 724 520 724 280 Z"/>
    </clipPath>
  </defs>

  <!-- background tile with bevelled frame -->
  <rect x="0" y="0" width="1024" height="1024" fill="#02050b"/>
  <rect x="36" y="36" width="952" height="952" rx="56" fill="url(#bg)"/>
  <rect x="36" y="36" width="952" height="952" rx="56" fill="none" stroke="#c99a3c" stroke-width="20"/>
  <rect x="58" y="58" width="908" height="908" rx="40" fill="none" stroke="#02050b" stroke-width="10" opacity="0.8"/>

  <g transform="translate(0,40)">
  <!-- glow -->
  <circle cx="512" cy="470" r="400" fill="url(#glow)"/>

  <!-- base + stem -->
  <ellipse cx="512" cy="842" rx="190" ry="46" fill="url(#metal)" stroke="#02050b" stroke-width="18"/>
  <path d="M478 640 L470 790 Q512 812 554 790 L546 640 Z" fill="url(#metal)" stroke="#02050b" stroke-width="18" stroke-linejoin="round"/>
  <ellipse cx="512" cy="700" rx="52" ry="18" fill="url(#metal)" stroke="#02050b" stroke-width="12"/>

  <!-- liquid inside the bowl -->
  <g clip-path="url(#bowlClip)">
    <rect x="280" y="390" width="464" height="300" fill="url(#liquid)"/>
    <ellipse cx="512" cy="392" rx="214" ry="30" fill="#8fecff"/>
    <ellipse cx="512" cy="392" rx="214" ry="30" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.6"/>
    <!-- bubbles -->
    <circle cx="430" cy="500" r="16" fill="#cff6ff" opacity="0.75"/>
    <circle cx="590" cy="470" r="11" fill="#cff6ff" opacity="0.7"/>
    <circle cx="540" cy="560" r="9" fill="#cff6ff" opacity="0.6"/>
    <circle cx="465" cy="590" r="7" fill="#cff6ff" opacity="0.55"/>
  </g>

  <!-- glass bowl -->
  <path d="M300 280 C300 520 395 640 512 648 C629 640 724 520 724 280 Z" fill="url(#glass)"/>
  <path d="M345 330 C345 480 395 570 455 605" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" opacity="0.55"/>
  <path d="M300 280 C300 520 395 640 512 648 C629 640 724 520 724 280" fill="none" stroke="#02050b" stroke-width="20" stroke-linejoin="round"/>
  <path d="M300 280 C300 520 395 640 512 648 C629 640 724 520 724 280" fill="none" stroke="#bfe6ff" stroke-width="7" opacity="0.8"/>

  <!-- rim (gold band) -->
  <ellipse cx="512" cy="280" rx="212" ry="36" fill="none" stroke="#02050b" stroke-width="40"/>
  <ellipse cx="512" cy="280" rx="212" ry="36" fill="none" stroke="url(#metal)" stroke-width="22"/>

  </g>

  <!-- falling drop -->
  <path d="M512 84 C512 84 456 154 456 188 A56 56 0 0 0 568 188 C568 154 512 84 512 84 Z" fill="url(#drop)" stroke="#02050b" stroke-width="16" stroke-linejoin="round"/>
  <path d="M484 180 C484 164 493 148 501 137" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.85"/>

  <!-- sparkles -->
  <g fill="#e6fbff">
    <path d="M232 300 L244 340 L284 352 L244 364 L232 404 L220 364 L180 352 L220 340 Z"/>
    <path d="M800 220 L809 250 L839 259 L809 268 L800 298 L791 268 L761 259 L791 250 Z"/>
    <path d="M790 560 L798 584 L822 592 L798 600 L790 624 L782 600 L758 592 L782 584 Z" opacity="0.8"/>
    <path d="M238 600 L245 620 L265 627 L245 634 L238 654 L231 634 L211 627 L231 620 Z" opacity="0.7"/>
  </g>
</svg>
